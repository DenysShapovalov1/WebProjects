<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --sidebar-close-btn: #ff6b6b;
            --sidebar-close-btn-hover: #ff4b4b;
            --chat-bg: #495057;
            --chat-bg-hover: #6c757d;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--main-bg-color);
        }
        .sidebar {
            width: 250px;
            background-color: var(--header-color);
            color:  var(--text-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            
        }
        .sidebar h2 {
            margin-top: 50px;
        }
       
        .sidebar .chat-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }
        .sidebar .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            background-color: var(--chat-bg);
            margin-bottom: 10px;
            cursor: pointer;
        }
        .sidebar .chat-item:hover {
            background-color: var(--chat-bg-hover);
        }
        .sidebar .chat-item button {
            background: none;
            border: none;
            color: var(--sidebar-close-btn);
            font-size: 18px;
            cursor: pointer;
        }
        .sidebar .chat-item button:hover {
            color: var(--sidebar-close-btn-hover);
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background-color: var(--timer-under-panel);
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: var(--header-color);
            margin-top: 50px;
        }
        .chat-message {
            margin-bottom: 15px;
            color: var(--text-color);
        }
        .chat-message p {
            margin: 0 0 10px;
        }
        .input-container {
            display: flex;
            gap: 10px;
            
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            border: none;
            background-color: var(--header-color);
            color: var(--text-color);
        }

        input[type="text"]::selection{
            border: none;
        }
        .input-container button {
            background-color: var(--header-color);
            color:  var(--text-color);
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .chat-container p, p{
            color: var(--text-color);
            font-size: 1.125rem;
        }
        
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="navbar_container">
                <ul class="navbar_links">
                    <li><a href="index.html">Strona Główna</a></li>
                    <li><a href="ai.html">Zapytaj AI</a></li>
                    <li><a href="graph.html">Zbuduj Wykres</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="sidebar">
        <h2>Czaty</h2>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-container">
        <div id="chat" class="chat-container"><p><strong>AI:</strong> Stworzony nowy czat! Jak mogę pomóc?</p></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Wpisz wiadomość..." />
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>
    
    <script>
        const API_URL = "https://api-inference.huggingface.co/models/google/gemma-2-2b-it";
        const API_KEY = "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"; 
    
        let chatIndex = 0;
        const chatData = [];
    
        
        window.onload = function() {
            loadChats();
        };
    
        function updateChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = chatData.map(chat => `
                <div class="chat-item">
                    <span onclick="loadChat(${chat.id})">Czat ${chat.id}</span>
                    <button onclick="deleteChat(${chat.id})">&times;</button>
                </div>
            `).join('');
        }

       
    
       
    
        function saveChat() {
            localStorage.setItem('chats', JSON.stringify(chatData));
            
        }
    
        function loadChats() {
            const savedChats = JSON.parse(localStorage.getItem('chats') || '[]');
            chatData.splice(0, chatData.length, ...savedChats); 
            updateChatList();
            if (chatData.length > 0) {
                loadChat(chatData[0].id); 
            }
            
        }
    
        function loadChat(id) {
            const chat = chatData.find(chat => chat.id === id);
            if (chat) {
                document.getElementById('chat').innerHTML = chat.messages || '<p><strong>AI:</strong> Stworzony nowy czat! Jak mogę pomóc?</p>';
                chatIndex = id; 
            }
        }

        function deleteChat(id) {
            const chatIndex = chatData.findIndex(chat => chat.id === id);
                if (chatIndex !== -1) {
                    chatData.splice(chatIndex, 1);
                    updateChatList();
                    alert(`Czat ${id} został usunięty!`);
                    localStorage.clear();
                    document.getElementById('chat').innerHTML = chat.messages || '<p><strong>AI:</strong> Stworzony nowy czat! Jak mogę pomóc?</p>';
                }
        }
    
        async function sendMessage() {
            const userInput = document.getElementById('userInput').value.trim();
            const chatContainer = document.getElementById('chat');
    
            if (userInput === '') {
                alert('Wpisz wiadomość!');
                return;
            }
    
            
            const userMessage = document.createElement('div');
            userMessage.className = 'chat-message';
            userMessage.innerHTML = `<p><strong>Ty:</strong> ${userInput}</p>`;
            chatContainer.appendChild(userMessage);
    
            
            const aiLoadingMessage = document.createElement('div');
            aiLoadingMessage.className = 'chat-message';
            aiLoadingMessage.innerHTML = `<p><strong>AI:</strong> Myślę...</p>`;
            chatContainer.appendChild(aiLoadingMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;
    
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `Proszę odpowiedzieć na pytanie w języku polskim: ${userInput}`
                    })
                });
    
                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }
    
                const result = await response.json();
                const aiResponse = Array.isArray(result) && result[0]?.generated_text 
                    ? result[0].generated_text.split('\n').map(line => `<p>${line}</p>`).join('') 
                    : "Przepraszam, nie mogłem przetworzyć twojego zapytania.";
    
                aiLoadingMessage.innerHTML = `<strong>AI:</strong>${aiResponse}`;
            } catch (error) {
                aiLoadingMessage.innerHTML = `<p><strong>AI:</strong> Błąd: ${error.message}</p>`;
            }
    
            document.getElementById('userInput').value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;
    
            
            const currentChat = chatData.find(chat => chat.id === chatIndex);
            if (currentChat) {
                currentChat.messages = chatContainer.innerHTML;
            } else {
                chatData.push({ id: chatIndex, messages: chatContainer.innerHTML });
            }
            saveChat();
        }
    </script>
</body>
</html>
